<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HydroGeoLab переехал на hydrogeolab.app</title>
<link rel="canonical" href="https://hydrogeolab.app/">
<script>
  // Старый адрес mnaugolnov.github.io/hydrogeolab/... → та же страница на hydrogeolab.app
  (function () {
    var path = location.pathname.replace(/^\/hydrogeolab(?=\/|$)/, "") || "/";
    location.replace("https://hydrogeolab.app" + path + location.search + location.hash);
  })();
</script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 48px 16px; text-align: center; color: #0E4D3C; background: #fff; }
  a { color: #0E4D3C; font-weight: 600; }
</style>
</head>
<body>
<p>Сайт HydroGeoLab переехал на <a href="https://hydrogeolab.app/">hydrogeolab.app</a>.</p>
<p>Если переход не произошёл автоматически, нажмите на ссылку.</p>
</body>
</html>
